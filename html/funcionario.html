<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Funcionário - NutriAção</title>
    <link rel="stylesheet" href="/css/funcionaraio.css">
</head>
<body>
    
    <main>
        <h1>Olá, Carlos!</h1>       <!--<main>: conteúdo principal da página-->

        <h2>Confirmação de Presença</h2>        <!--<h2>: subtítulo da página-->

        <form action="#" method="post">     <!--<form>: agrupa a confirmação para ser enviada de uma vez-->
            <section class="rsvp">
                <h3>
                    <label for="almoco">Vou Almoçar Hoje</label>
                </h3>

                <input type="checkbox" name="almoco" id="almoco">

                <p>RSVP Livre até às 10:00</p>
            </section>

            <section>
                <h3>Cardápio do Dia</h3>

                <h4>Prato Principal:</h4>
                <p>Feijoada Completa</p>

                <h4>Opção Vegana:</h4>
                <p>Feijoada com Cogumelos</p>

                <h4>Acompanhamentos:</h4>
                <p>Arroz, Couve, Farofa e Laranja</p>
            </section>

            <button type="submit">Confirmar RSVP</button>

        </form>
    </main>

</body>
</html>
